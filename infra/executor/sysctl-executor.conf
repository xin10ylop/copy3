# /etc/sysctl.d/90-hood-executor.conf - low-latency TCP for the burst sender.
# Keep-alive connections must not fall back to slow start between launches.
net.ipv4.tcp_slow_start_after_idle = 0
# Do not let the kernel cork small writes (each burst tx is a small HTTP request).
net.ipv4.tcp_autocorking = 0
net.ipv4.tcp_notsent_lowat = 16384
net.ipv4.tcp_fastopen = 3
# Busy-poll the NIC queue on blocking reads (µs-level wakeups for the feed websocket).
net.core.busy_poll = 50
net.core.busy_read = 50
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 4096
# Detect dead keep-alive connections to the RPC within ~2 min.
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6
vm.swappiness = 1
kernel.numa_balancing = 0
fs.file-max = 2097152
