# HoodSniper executor: chrony tuned for sub-millisecond accuracy in AWS us-east-2 (Ohio).
# The burst timing is calibrated against the sequencer feed, but a stable, slewed (never stepped
# mid-session) local clock keeps that calibration valid between blocks.
#
# Amazon Time Sync Service (link-local, served by the Nitro hypervisor in every AZ; leap-smeared).
server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4
# Fallback: Amazon's public NTP (same leap-smear, so sources stay consistent).
pool time.aws.com iburst minpoll 6 maxpoll 8 maxsources 2
# If the instance exposes the ENA PTP hardware clock (/dev/ptp0), install-executor.sh adds
#   refclock PHC /dev/ptp0 poll 0 delay 0.000010 prefer
# in /etc/chrony/conf.d/hood-phc.conf (microsecond-level accuracy).

driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
keyfile /etc/chrony/chrony.keys
logdir /var/log/chrony
log tracking measurements statistics

# Step only during the first 3 updates after boot; afterwards always slew (no jumps during a burst).
makestep 0.1 3
# Ignore sources whose estimates are too uncertain; react quickly with tight polling above.
maxupdateskew 5.0
maxdistance 0.1
# Keep the RTC in sync and use NIC hardware timestamps where the driver supports them.
rtcsync
hwtimestamp *

confdir /etc/chrony/conf.d
sourcedir /etc/chrony/sources.d
